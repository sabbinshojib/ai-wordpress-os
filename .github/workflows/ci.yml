name: CI

on:
  push:
    branches: [ main, 'sprint/**' ]
  # The repository's default branch is sprint/0.3-security-ci and no
  # `main` branch exists yet, so pull requests target sprint branches
  # during this phase of the roadmap. CI must run for those PRs too,
  # otherwise pull-request verification is structurally impossible.
  pull_request:
    branches: [ main, 'sprint/**' ]
  workflow_dispatch: {}

# A run superseded by a newer push on the same branch/PR is cancelled
# rather than left to finish, so CI capacity isn't spent on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Required matrix: the two PHP versions Sprint 0.3A verifies locally
  # (WP-like native suite, real PHPUnit bridge, acceptance, lint).
  # ------------------------------------------------------------------
  test:
    name: "Test (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, openssl, sqlite3, pdo
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Syntax lint (php -l on every file)
        run: composer run lint

      - name: Native WP-like suite (tests/run.php)
        run: composer test

      - name: Real PHPUnit bridge (native-bridge suite)
        run: composer run test:phpunit

      - name: Acceptance suite
        run: composer run acceptance

  # ------------------------------------------------------------------
  # Best-effort PHP 8.4 — included per Sprint 0.3A instructions ("PHP
  # 8.4 in CI if reliable"), but not gating: this repository's local
  # portable PHP 8.4 could not even start on the machine that authored
  # this workflow (a Visual C++ runtime mismatch specific to that
  # host, unrelated to the plugin), so 8.4 has never actually been
  # exercised against this codebase. GitHub's hosted runners provide a
  # correctly provisioned PHP 8.4 via setup-php, so this job is kept —
  # but as non-blocking until a real run establishes it is clean.
  # ------------------------------------------------------------------
  test-php84:
    name: "Test (PHP 8.4, best-effort)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, openssl, sqlite3, pdo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Syntax lint (php -l on every file)
        run: composer run lint

      - name: Native WP-like suite (tests/run.php)
        run: composer test

      - name: Real PHPUnit bridge (native-bridge suite)
        run: composer run test:phpunit

      - name: Acceptance suite
        run: composer run acceptance

  # ------------------------------------------------------------------
  # Real WordPress + real MySQL smoke test (Sprint 0.3A Phase 2 final
  # hardening, Package P). Everything above this job runs the custom
  # WP-like shim in tests/shim/ — deliberately, so it can run without
  # any server dependency — which means NONE of it has ever proven
  # this plugin's migrations (dbDelta), CAS transitions, or encrypted
  # persistence actually work against a real wpdb/MySQL connection.
  # This job is the one that does: it boots an ephemeral MySQL service
  # container (never a persisted/shared database, never production),
  # installs a throwaway WordPress core + this plugin via WP-CLI, lets
  # activation run every real migration (including
  # Migration_202509070001_ChangeSets and
  # Migration_202509070002_OperationJournal) through real dbDelta
  # against real MySQL, then runs a small `wp eval` smoke script that:
  #   - confirms every table in AIOS\Database\Database::ALL_TABLES
  #     exists with its expected columns,
  #   - round-trips one ChangeSetRepository::create()/load() and one
  #     OperationJournalRepository::create()/load() against the real
  #     database (proves INSERT/SELECT and the encrypted-at-rest
  #     Crypto envelope work outside the shim's fake SQL engine),
  #   - confirms a compare-and-swap ChangeSetRepository::transition()
  #     succeeds once and fails on a stale version, against real
  #     MySQL row-locking semantics rather than the shim's in-memory
  #     array.
  #
  # VERIFIED GREEN as of run 34271861192 (2026-09): boots an ephemeral
  # MySQL 8.0 container, installs throwaway WordPress core + this plugin
  # via WP-CLI, runs every real migration through real dbDelta, and
  # executes the tools/ci/real-db-smoke.php checks (tables, columns,
  # encrypted CRUD round-trip, CAS transition). See
  # docs/audits/SPRINT-0.3-PHASE2-EXIT-GATE-REPORT.md for the record.
  # ------------------------------------------------------------------
  test-real-wp-mysql:
    name: "Real WordPress + MySQL smoke test"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, openssl, mysqli
          coverage: none
          tools: wp-cli

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL did not become ready after 60s (30 retries at 2s)." >&2
          exit 1

      - name: Download WordPress core
        run: wp core download --path=/tmp/wordpress --version=latest --locale=en_US

      - name: Configure wp-config.php
        working-directory: /tmp/wordpress
        run: |
          wp config create \
            --dbname=wordpress_test --dbuser=root --dbpass= --dbhost=127.0.0.1 \
            --path=/tmp/wordpress --skip-check

      - name: Install WordPress
        working-directory: /tmp/wordpress
        run: |
          wp core install \
            --url=http://localhost --title="AIOS CI" \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.test \
            --path=/tmp/wordpress

      - name: Link this plugin into the throwaway install
        run: |
          rm -rf /tmp/wordpress/wp-content/plugins/ai-wordpress-os
          cp -r "${GITHUB_WORKSPACE}" /tmp/wordpress/wp-content/plugins/ai-wordpress-os

      - name: Activate plugin (runs every real migration via dbDelta)
        working-directory: /tmp/wordpress
        run: wp plugin activate ai-wordpress-os --path=/tmp/wordpress

      - name: Real-database smoke checks (tables, CRUD, CAS — see job docblock)
        working-directory: /tmp/wordpress
        run: wp eval-file wp-content/plugins/ai-wordpress-os/tools/ci/real-db-smoke.php --path=/tmp/wordpress

  # ------------------------------------------------------------------
  # Static analysis: PHPStan (WordPress-aware via phpstan-wordpress +
  # wordpress-stubs) and PHPCS (WordPress-Extra). See phpstan.neon.dist
  # and phpcs.xml.dist for the honest-baseline rationale — this job is
  # expected to be green against the level/ruleset actually checked
  # in, not against a suppressed copy of it.
  # ------------------------------------------------------------------
  static-analysis:
    name: Static analysis (PHPStan + PHPCS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, openssl
          coverage: none
          tools: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: composer run stan

      - name: PHPCS (WordPress-Extra)
        run: composer run cs
